<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>激活</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f6f8;color:#222;
       display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
  h2{font-size:17px;margin:0 0 6px}
  .sub{color:#999;font-size:12px;margin-bottom:20px}
  input{width:280px;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;text-align:center;
        letter-spacing:1px;font-family:Consolas,monospace;text-transform:uppercase}
  input:focus{outline:0;border-color:#ff6a00;box-shadow:0 0 0 3px rgba(255,106,0,.1)}
  button{margin-top:16px;width:280px;padding:11px;border:0;background:#ff6a00;color:#fff;border-radius:8px;
         font-size:15px;cursor:pointer}
  button:disabled{background:#ffb27a;cursor:default}
  #st{margin-top:14px;font-size:12px;color:#999;min-height:18px;text-align:center;line-height:1.6}
  #st.err{color:#d9534f}
  #st.ok{color:#22a06b}
</style></head><body>
  <h2>激活</h2>
  <div class="sub">请输入服务商提供的激活码</div>
  <input id="code" placeholder="KS-XXXX-XXXX" autofocus>
  <button id="btn" onclick="doActivate()">激活</button>
  <div id="st">激活后即可添加店铺</div>

<script>
const { ipcRenderer } = require('electron');
const $ = (id) => document.getElementById(id);

$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doActivate(); });

async function doActivate() {
  const code = ($('code').value || '').trim();
  if (!code) { set('请输入激活码', 'err'); return; }
  $('btn').disabled = true;
  set('正在激活…', '');

  const r = await ipcRenderer.invoke('license:activate', code);
  if (r.ok) {
    const l = r.license || {};
    set(`✓ 激活成功：${l.name || ''}　店铺位 ${l.slots || 0} 个` + (l.expires_at ? `　到期 ${l.expires_at}` : ''), 'ok');
    $('btn').textContent = '进入';
    $('btn').disabled = false;
    $('btn').onclick = () => window.close();
  } else {
    set(r.message || '激活失败', 'err');
    $('btn').disabled = false;
  }
}

function set(t, cls) { const s = $('st'); s.textContent = t; s.className = cls || ''; }

// 已激活则直接显示状态（用于"重新打开激活窗口"的场景）
ipcRenderer.invoke('license:info').then((i) => {
  if (i.license) {
    set(`当前已激活：${i.license.name || ''}　店铺位 ${i.license.slots || 0} 个`, 'ok');
    $('code').placeholder = i.license.code || '';
  } else if (!i.server) {
    set('未配置授权中心地址，请联系服务商', 'err');
  }
});
</script>
</body></html>
