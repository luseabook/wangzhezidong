<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>激活</title>
<link rel="stylesheet" href="theme.css">
</head><body class="activate-page">
  <section class="activate-card">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M6 3.5h9.5L19 7v13.5H6z"/><path d="M9 9h7M9 12.5h7M9 16h4.5"/></svg></span>
      <div class="brand-copy"><b>激活更新助手</b><span>ORDER SYNC / ACTIVATION</span></div>
    </div>

    <h1 class="activate-title">输入激活码</h1>
    <p class="activate-sub">使用服务商提供的激活码，激活后即可添加店铺并开始同步。</p>
    <label class="field-label" for="code">ACTIVATION CODE</label>
    <input id="code" class="code-input" placeholder="KS-XXXX-XXXX" autofocus autocomplete="off">
    <button class="btn primary" id="btn" onclick="doActivate()">激活</button>
    <div id="st" class="activate-status">激活后即可添加店铺</div>
    <div class="activate-foot"><span>AUTHORIZED CLIENT</span><span>NODE / LOCAL</span></div>
  </section>

<script>
const { ipcRenderer } = require('electron');
const $ = (id) => document.getElementById(id);

$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doActivate(); });

async function doActivate() {
  const code = ($('code').value || '').trim();
  if (!code) { set('请输入激活码', 'err'); return; }
  $('btn').disabled = true;
  set('正在激活…', '');

  const r = await ipcRenderer.invoke('license:activate', code);
  if (r.ok) {
    const l = r.license || {};
    set(`激活成功：${l.name || ''}　店铺位 ${l.slots || 0} 个` + (l.expires_at ? `　到期 ${l.expires_at}` : ''), 'ok');
    $('btn').textContent = '进入';
    $('btn').disabled = false;
    $('btn').onclick = () => window.close();
  } else {
    set(r.message || '激活失败', 'err');
    $('btn').disabled = false;
  }
}

function set(t, cls) {
  const s = $('st');
  s.textContent = t;
  s.className = 'activate-status' + (cls ? ' ' + cls : '');
}

ipcRenderer.invoke('license:info').then((i) => {
  if (i.license) {
    set(`当前已激活：${i.license.name || ''}　店铺位 ${i.license.slots || 0} 个`, 'ok');
    $('code').placeholder = i.license.code || '';
  } else if (!i.server) {
    set('未配置授权中心地址，请联系服务商', 'err');
  }
});
</script>
</body></html>
