<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>快手订单自动同步</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f6f8;color:#222;font-size:13px}
  .top{background:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8e8e8}
  .top h1{font-size:16px;margin:0;font-weight:600}
  .top .sum{margin-left:auto;color:#888;font-size:12px}
  .btn{border:0;background:#ff6a00;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff;color:#555;border:1px solid #ddd}
  .list{background:#fff;margin:12px;border-radius:8px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f2}
  .row:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:#999}
  .dot.ok{background:#22a06b}.dot.warn{background:#f0ad4e}
  .dot.error{background:#d9534f}.dot.idle{background:#ccc}
  .nick{font-weight:600;min-width:140px}
  .meta{color:#999;font-size:12px}
  .act{margin-left:auto;display:flex;gap:6px}
  .mini{border:1px solid #e0e0e0;background:#fff;color:#555;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px}
  .mini:hover{border-color:#ff6a00;color:#ff6a00}
  .empty{padding:56px 20px;text-align:center;color:#aaa}
  .empty b{display:block;color:#555;font-size:15px;margin-bottom:8px;font-weight:600}
  .foot{padding:10px 12px;display:flex;gap:8px;align-items:center;color:#aaa;font-size:12px}
  .foot .spacer{margin-left:auto}
  .badge{display:inline-block;padding:1px 6px;border-radius:8px;background:#fff3e8;color:#ff6a00;font-size:11px}
</style></head><body>
<div class="top">
  <h1>快手订单自动同步</h1>
  <span class="sum" id="sum">—</span>
  <button class="btn" onclick="addShop()">+ 添加店铺</button>
</div>
<div id="banner" style="display:none;padding:9px 20px;font-size:12px"></div>
<div class="list" id="list"><div class="empty"><b>还没有添加店铺</b>点右上角「添加店铺」，用快手小店商家版 APP 扫码即可</div></div>
<div class="foot">
  <button class="mini" onclick="syncAll()">立即同步全部</button>
  <button class="mini" onclick="openData()">打开数据目录</button>
  <span class="spacer" id="interval"></span>
</div>

<script>
const { ipcRenderer } = require('electron');
let NEEDS = {};

function statusClass(s){
  if (s === 'ok') return 'ok';
  if (s === 'warn' || s === 'running') return 'warn';
  if (s === 'need_login' || s === 'error') return 'error';
  return 'idle';
}
function ago(iso){
  if (!iso) return '尚未同步';
  const d = new Date(iso); const min = Math.floor((Date.now() - d) / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return min + ' 分钟前';
  const h = Math.floor(min / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function needText(s){
  if (s === 'need_login') return '需要重新扫码';
  if (s === 'error') return '暂时中断';
  if (s === 'warn') return '有异常，正在重试';
  if (s === 'disabled') return '已停用';
  return '';
}

async function render(){
  const { shops, lastRun, needs, interval, license } = await ipcRenderer.invoke('shops:list');
  NEEDS = needs || {};
  const active = shops.filter(s => s.enabled);
  const todaySum = active.reduce((a, s) => a + ((s.stats && s.stats.today) || 0), 0);
  document.getElementById('sum').textContent =
    `${active.length} 个店铺在同步 · 今日 ${todaySum} 单` + (lastRun ? ` · 上次 ${ago(lastRun)}` : '');
  document.getElementById('interval').textContent = `每 ${interval} 分钟自动同步`;

  // 授权配额与到期提示
  const banner = document.getElementById('banner');
  if (license) {
    const parts = [`已用 ${license.used}/${license.slots} 店铺位`];
    if (license.expires_at) parts.push(`到期 ${license.expires_at}`);
    banner.style.display = '';
    banner.style.background = '#f1f8ff';
    banner.style.color = '#1c7ed6';
    banner.textContent = parts.join(' · ');
    if (license.grace && license.grace.expired) {
      banner.style.background = '#ffe3e3'; banner.style.color = '#c92a2a';
      banner.textContent = '授权已过期，自动上传已暂停，请联系续费';
    } else if (license.grace && !license.grace.expired) {
      banner.style.background = '#fff9db'; banner.style.color = '#e67700';
      banner.textContent = `授权将在 ${license.grace.days} 天后到期，请及时续费 · ` + parts.join(' · ');
    }
  } else {
    banner.style.display = 'none';
  }

  const list = document.getElementById('list');
  if (!shops.length){
    list.innerHTML = '<div class="empty"><b>还没有添加店铺</b>点右上角「添加店铺」，用快手小店商家版 APP 扫码即可</div>';
    return;
  }
  list.innerHTML = shops.map(s => {
    const cls = statusClass(s.busy ? 'running' : s.last_status);
    const need = s.busy ? '同步中…' : needText(s.last_status);
    const today = (s.stats && s.stats.today) || 0;
    return `<div class="row">
      <span class="dot ${cls}"></span>
      <span class="nick">${esc(s.nick)}</span>
      <span class="meta">${need ? `<span class="badge">${need}</span>` : ''} ${ago(s.last_sync_at)}${today ? ` · 今日 ${today} 单` : ''}</span>
      <span class="act">
        ${s.last_status === 'need_login' ? `<button class="mini" onclick="act('${s.id}','rescan')">重新扫码</button>` : ''}
        <button class="mini" onclick="act('${s.id}','sync')">立即同步</button>
        <button class="mini" onclick="act('${s.id}','${s.enabled ? 'disable' : 'enable'}')">${s.enabled ? '停用' : '启用'}</button>
        <button class="mini" onclick="act('${s.id}','remove')">移除</button>
      </span>
    </div>`;
  }).join('');
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function act(id, action){
  if (action === 'remove' && !confirm('移除后该店铺不再同步（历史数据会保留），确定吗？')) return;
  await ipcRenderer.invoke('shops:action', { id, action });
  render();
}
async function addShop(){ await ipcRenderer.invoke('shops:add'); }
async function syncAll(){ ipcRenderer.invoke('shops:syncAll'); }
async function openData(){ ipcRenderer.invoke('app:openData'); }

ipcRenderer.on('shop:changed', render);
ipcRenderer.on('shops:changed', render);
ipcRenderer.on('shop:progress', render);
setInterval(render, 3000);
render();
</script>
</body></html>
