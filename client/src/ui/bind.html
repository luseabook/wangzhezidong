<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绑定店铺</title>
<link rel="stylesheet" href="theme.css">
</head><body class="bind-page">
  <section class="bind-card">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M6 3.5h9.5L19 7v13.5H6z"/><path d="M9 9h7M9 12.5h7M9 16h4.5"/></svg></span>
      <div class="brand-copy"><b>绑定店铺</b><span>SCAN TO BIND</span></div>
    </div>

    <div id="qrBox" class="qr-shell">
      <img id="q" alt="店铺绑定二维码">
      <span id="ph" class="qr-placeholder">正在获取二维码…</span>
      <span class="qr-refresh">点击刷新</span>
    </div>

    <div class="tip" id="tip">打开 <b>快手小店商家版 APP</b><br>左上角「扫一扫」扫描上方二维码</div>
    <div class="bind-status" id="st">请稍候…</div>
    <div class="bind-foot">可连续扫码添加多个店铺 · 每个店铺独立登录态</div>
  </section>

<script>
const { ipcRenderer } = require('electron');
const q = document.getElementById('q');
const ph = document.getElementById('ph');
const st = document.getElementById('st');
const tip = document.getElementById('tip');

ipcRenderer.on('bind:qr', (_e, dataUrl) => {
  q.src = dataUrl;
  q.style.opacity = '1';
  if (ph) ph.style.display = 'none';
  st.textContent = '等待扫码…（二维码会自动刷新）';
});

document.getElementById('qrBox').addEventListener('click', () => {
  ipcRenderer.send('bind:refresh');
  st.textContent = '正在刷新二维码…';
});

ipcRenderer.on('bind:status', (_e, text) => { st.textContent = text; });
ipcRenderer.on('bind:done', (_e, shop) => {
  document.body.classList.add('ok');
  tip.innerHTML = '<b>已添加</b> ' + (shop.nick || shop.id);
});
ipcRenderer.on('bind:next', (_e, n) => {
  document.body.classList.remove('ok');
  tip.innerHTML = '打开 <b>快手小店商家版 APP</b><br>左上角「扫一扫」扫描上方二维码';
  q.style.opacity = '0';
  if (ph) { ph.style.display = ''; ph.textContent = '正在获取二维码…'; }
  st.textContent = `已添加 ${n} 个，继续扫下一个…`;
});
</script>
</body></html>
