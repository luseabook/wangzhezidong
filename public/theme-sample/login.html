<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 罗伯特结算系统</title>
  <link rel="stylesheet" href="../vendor/dcat-admin/fonts/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="../vendor/dcat-admin/fonts/feather/iconfont.css">
  <link rel="stylesheet" href="../vendor/dcat-admin/dcat/css/nunito.css">
  <link rel="stylesheet" href="../vendor/dcat-admin/adminlte/adminlte.css">
  <link rel="stylesheet" href="../vendor/dcat-admin/dcat/css/dcat-app.css">
  <link rel="stylesheet" href="../vendor/theme/tokens.css">
  <link rel="stylesheet" href="../vendor/theme/admin.css">
  <link rel="stylesheet" href="sample.css">
  <link rel="stylesheet" href="mono.css">
  <script>if (/[?&]theme=mono/.test(location.search)) document.documentElement.classList.add('mono');</script>
</head>
<body class="dcat-admin-body login-sample">

  <div class="login-page bg-40">
    <div class="login-box">
      <div class="login-logo login-brand mb-2">
        <div class="brandline">
          <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
            <defs>
              <linearGradient id="loginBrand" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6e8bff"></stop>
                <stop offset="1" stop-color="#2f4fd8"></stop>
              </linearGradient>
            </defs>
            <rect width="28" height="28" rx="9" fill="url(#loginBrand)"></rect>
            <path d="M9 8.5h10M10.5 13.2h7M10.5 17.9h7M8 22h12" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".95"></path>
          </svg>
          <div class="brand-copy">
            <span class="brand-text">罗伯特</span>
            <span class="brand-sub">SETTLEMENT</span>
          </div>
        </div>
        <div class="login-sub">结算系统 · 内部管理端</div>
      </div>

      <div class="card">
        <div class="card-body login-card-body shadow-100">
          <p class="login-box-msg mt-1 mb-1">欢迎回来，请登录管理后台</p>

          <form id="login-form" method="GET" action="dashboard.html">
            <fieldset class="form-label-group form-group position-relative has-icon-left">
              <input type="text" class="form-control" name="username" placeholder="用户名" value="admin" required autofocus>
              <div class="form-control-position">
                <i class="feather icon-user"></i>
              </div>
              <label for="username">用户名</label>
              <div class="help-block with-errors"></div>
            </fieldset>

            <fieldset class="form-label-group form-group position-relative has-icon-left">
              <input id="password" type="password" class="form-control" name="password" placeholder="密码" value="123456" required autocomplete="current-password">
              <div class="form-control-position">
                <i class="feather icon-lock"></i>
              </div>
              <label for="password">密码</label>
              <div class="help-block with-errors"></div>
            </fieldset>

            <div class="form-group d-flex justify-content-between align-items-center">
              <div class="text-left">
                <fieldset class="checkbox">
                  <div class="vs-checkbox-con vs-checkbox-primary">
                    <input id="remember" name="remember" value="1" type="checkbox">
                    <span class="vs-checkbox">
                      <span class="vs-checkbox--check">
                        <i class="vs-icon feather icon-check"></i>
                      </span>
                    </span>
                    <span> 记住我</span>
                  </div>
                </fieldset>
              </div>
            </div>

            <button type="submit" class="btn btn-primary float-right login-btn">
              登录
              &nbsp;
              <i class="feather icon-arrow-right"></i>
            </button>
          </form>
        </div>
      </div>

      <p class="login-footer">© 2026 罗伯特 · 结算系统</p>
      <p class="login-footer" style="margin-top:6px;">样张 · 仅展示视觉层，登录流程与原来一致</p>
    </div>
  </div>

  <div class="sample-ribbon">
    <span>UI 样张</span>
    <a href="?">墨蓝 v2</a>
    <a href="?theme=mono">黑白非线性</a>
    <a href="index.html">索引</a>
  </div>

</body>
</html>
